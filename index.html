<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solo Lesson Builder 0.11</title>
<style>
:root{
  /* Exact Guit-Map geometry */
  --board-w:183px;
  --board-h:586px;
  --head-h:56px;
  --nut-h:14px;

  --pink:#ff1493;
  --green:#21f07d;
  --red:#ff4d5d;
  --blue:#4aa3ff;
  --text-main:#f2f6fb;
  --text-muted:#aeb9c8;
}
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#182235 0%,#0b0f17 42%,#05070b 100%);
  color:var(--text-main);
}
body{
  width:100%;
  min-width:max-content;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:12px;
  overflow:auto;
}
button,select{font:inherit}

/* Guit-Map shell dimensions */
.app{
  position:relative;
  display:inline-block;
  flex-shrink:0;
  border:1px solid rgba(180,205,240,.16);
  border-radius:28px;
  padding:20px;
  margin:24px auto;
  background:linear-gradient(180deg,rgba(24,32,46,.94),rgba(10,14,22,.96));
  box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
}
.apptitle{
  position:absolute;
  top:8px;left:0;right:0;
  text-align:center;
  font-size:11px;
  line-height:1;
  letter-spacing:1px;
  text-transform:uppercase;
  color:rgba(235,242,255,.72);
  font-weight:700;
  pointer-events:none;
}
.layout{
  display:flex;
  gap:18px;
  align-items:flex-start;
  justify-content:center;
  flex-wrap:nowrap;
}
.leftcol{
  width:92px;
  min-width:92px;
  min-height:684px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
  flex-shrink:0;
}
.maincol{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.panel,.wrap{
  border:1px solid rgba(210,226,255,.14);
  box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);
}
.panel{
  width:92px;
  border-radius:18px;
  padding:8px;
  background:linear-gradient(180deg,rgba(29,39,56,.92),rgba(16,23,35,.92));
}
.wrap{
  padding:20px;
  border-radius:18px;
  background:linear-gradient(180deg,rgba(18,26,38,.7),rgba(8,12,19,.72));
  box-shadow:0 22px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
}
.shell{
  position:relative;
  width:var(--board-w);
  padding-top:var(--head-h);
  background:linear-gradient(180deg,rgba(105,135,178,.10),rgba(255,255,255,0) 18%,rgba(255,255,255,.02) 50%,rgba(0,0,0,.18) 100%),#101722;
  box-shadow:inset 0 0 0 1px rgba(210,226,255,.10),inset 10px 0 22px rgba(0,0,0,.18),inset -10px 0 22px rgba(0,0,0,.18);
  isolation:isolate;
  transform:translateY(-22px);
}
.openrow{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:var(--head-h);
  pointer-events:none;
}
.nut{
  position:absolute;
  top:calc(var(--head-h) - 4px);
  left:0;
  width:100%;
  height:var(--nut-h);
  background:#e8eef7;
  box-shadow:0 0 10px rgba(255,255,255,.22);
  z-index:5;
}
.board{
  position:relative;
  width:100%;
  height:var(--board-h);
  overflow:visible;
  background:linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 100%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.16));
}
.fret{
  position:absolute;
  left:0;
  width:100%;
  height:2px;
  background:rgba(230,240,255,.42);
  box-shadow:0 0 6px rgba(140,180,255,.18);
  z-index:2;
}
.string{
  position:absolute;
  top:0;
  height:100%;
  transform:translateX(-50%);
  background:rgba(232,241,255,.62);
  box-shadow:0 0 6px rgba(180,210,255,.26);
  border-radius:999px;
  z-index:3;
}
.inlay{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:rgba(232,241,255,.22);
  left:50%;
  transform:translate(-50%,-50%);
  z-index:1;
}
.open{
  position:absolute;
  top:32px;
  transform:translateX(-50%);
  width:23px;height:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-muted);
  pointer-events:none;
  z-index:2;
  font-size:12px;
  font-weight:800;
}
.hit{
  position:absolute;
  width:24px;
  transform:translate(-50%,-50%);
  border-radius:14px;
  cursor:pointer;
  z-index:30;
  touch-action:none;
  pointer-events:auto;
}
.openhit{
  position:absolute;
  top:32px;
  width:28px;height:32px;
  transform:translate(-50%,-50%);
  border-radius:14px;
  z-index:31;
  pointer-events:auto;
  touch-action:none;
}
.fretlab{
  position:absolute;
  right:-18px;
  transform:translateY(-50%);
  width:18px;
  text-align:center;
  color:var(--text-muted);
  z-index:16;
  font-size:12px;
  pointer-events:none;
}

/* Guit-Map-sized 23px markers */
.frameworkMark,.fingerMark{
  position:absolute;
  width:23px;height:23px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%);
  z-index:20;
  pointer-events:none;
  font-size:11px;
  font-weight:800;
}
.frameworkMark.in{
  background:var(--green);
  color:#04140b;
  box-shadow:0 0 10px rgba(33,240,125,.38),0 3px 8px rgba(0,0,0,.4);
}
.frameworkMark.out{
  background:var(--red);
  color:white;
  box-shadow:0 0 10px rgba(255,77,93,.36),0 3px 8px rgba(0,0,0,.4);
}
.fingerMark{
  background:var(--pink);
  color:white;
  box-shadow:0 0 12px rgba(255,20,147,.55),0 3px 8px rgba(0,0,0,.42);
}
.fingerMark.bendRing{
  background:transparent;
  color:transparent;
  border:4px solid var(--pink);
  box-shadow:0 0 12px rgba(255,20,147,.62),0 3px 8px rgba(0,0,0,.42);
}

/* Playback transition overlay */
.movementSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
  z-index:24;
}
.moveLabel{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:26;
  pointer-events:none;
  padding:3px 5px;
  border-radius:7px;
  background:rgba(7,10,16,.90);
  border:1px solid rgba(255,20,147,.72);
  color:#fff;
  font-size:9px;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.42);
}

/* Controls */
.sel{
  width:92px;
  height:30px;
  border:1px solid rgba(255,255,255,.30);
  border-radius:9px;
  background:linear-gradient(180deg,#0d1420,#080c13);
  color:#f7fbff;
  font-size:11px;
  font-weight:700;
  text-align:center;
  text-align-last:center;
  padding:0 4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}

.sidebarSection{
  width:92px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.sectionLabel{
  font-size:8px;
  line-height:1;
  letter-spacing:.9px;
  text-transform:uppercase;
  color:#95a3b6;
  font-weight:800;
  text-align:left;
  padding-left:1px;
}
.sidebarSeparator{
  width:92px;
  height:1px;
  background:rgba(215,226,242,.18);
  flex:0 0 1px;
}

.noteTool,
.moveBtn{
  width:92px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(180deg,#172233,#0f1722);
  color:#eef4fb;
  padding:0 7px;
  font-size:10px;
  font-weight:800;
  line-height:1;
  text-align:left;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  transition:border-color .12s ease,box-shadow .12s ease,background .12s ease,transform .12s ease;
}
.noteTool:active,.moveBtn:active{transform:translateY(1px)}

.frameworkTool{
  border:1px solid rgba(33,240,125,.72);
}
.frameworkTool.on{
  background:linear-gradient(180deg,rgba(25,63,47,.98),rgba(13,35,27,.98));
  box-shadow:
    inset 0 0 0 1px rgba(33,240,125,.42),
    0 0 10px rgba(33,240,125,.16);
}

.dynamicTool{
  border:1px solid rgba(255,20,147,.72);
}
.dynamicTool.on{
  background:linear-gradient(180deg,rgba(76,24,63,.98),rgba(41,12,34,.98));
  box-shadow:
    inset 0 0 0 1px rgba(255,20,147,.42),
    0 0 10px rgba(255,20,147,.18);
}

.movementStack{
  width:92px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.moveBtn{
  border:1px solid rgba(214,230,255,.16);
}
.moveBtn.on{
  border-color:rgba(255,20,147,.82);
  background:linear-gradient(180deg,rgba(78,25,64,.96),rgba(42,13,34,.96));
  box-shadow:
    inset 0 0 0 1px rgba(255,20,147,.55),
    0 0 9px rgba(255,20,147,.17);
}

.actionrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  width:92px;
}
.action{
  height:30px;
  border-radius:8px;
  border:1px solid rgba(214,230,255,.16);
  background:linear-gradient(180deg,#172233,#0f1722);
  color:#eef4fb;
  font-size:9px;
  font-weight:800;
  padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.action:active{transform:translateY(1px)}

.sequenceWrap{
  width:92px;
  flex:1 1 auto;
  min-height:140px;
  max-height:300px;
  display:flex;
  flex-direction:column;
  border-radius:12px;
  border:1px solid rgba(210,226,255,.11);
  background:rgba(7,11,18,.76);
  overflow:hidden;
}
.sequenceTitle{
  flex:0 0 auto;
  padding:6px 7px 5px;
  border-bottom:1px solid rgba(255,255,255,.07);
  font-size:8px;
  line-height:1;
  letter-spacing:.7px;
  text-transform:uppercase;
  color:#8e9cb0;
  font-weight:800;
  text-align:left;
}
.eventpanel{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding:2px 6px 5px;
  background:transparent;
  border:0;
}
.event{
  padding:6px 2px;
  border-bottom:1px solid rgba(255,255,255,.055);
  font-size:8.4px;
  line-height:1.16;
  color:#d2dbe8;
  cursor:pointer;
  border-radius:5px;
}
.event:last-child{border-bottom:0}
.event:hover{background:rgba(255,255,255,.04)}
.event.selected{
  background:rgba(74,163,255,.13);
  box-shadow:inset 2px 0 0 rgba(112,178,255,.85);
  color:#fff;
}
.event .n{
  color:#6f7f94;
  margin-right:3px;
  font-variant-numeric:tabular-nums;
}

.modeToggle{
  width:92px;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
  border:1px solid rgba(210,226,255,.12);
  border-radius:9px;
  background:#090e16;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.modeToggle button{
  height:28px;
  border:0;
  background:transparent;
  color:#8492a6;
  font-size:8.5px;
  font-weight:800;
  padding:0;
}
.modeToggle button.on{
  background:linear-gradient(180deg,#edf3fb,#dbe5f2);
  color:#07101b;
}

.playbar{
  width:92px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.progress{
  width:92px;
  height:4px;
  background:#080d15;
  border-radius:99px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
}
.progressFill{
  height:100%;
  width:0%;
  background:var(--pink);
}

.playerOnly{display:none}
body.player .adminOnly{display:none!important}
body.player .playerOnly{display:grid}
</style>
</head>
<body>
<div class="app">
  <div class="apptitle">Lesson Builder</div>

  <div class="layout">
    <div class="leftcol">
      <div class="modeToggle">
        <button id="adminTab" class="on">Admin</button>
        <button id="playerTab">Player</button>
      </div>

      <div class="sidebarSection adminOnly">
        <div class="sectionLabel">Key</div>
        <select id="keySel" class="sel"></select>
      </div>

      <div class="sidebarSeparator adminOnly"></div>

      <div class="sidebarSection adminOnly">
        <div class="sectionLabel">Notes</div>
        <button class="noteTool frameworkTool on" data-tool="framework">Framework</button>
        <button class="noteTool dynamicTool" data-tool="finger">Dynamic</button>
      </div>

      <div class="sidebarSeparator adminOnly"></div>

      <div class="sidebarSection adminOnly">
        <div class="sectionLabel">Movement</div>
        <div class="movementStack">
          <button class="moveBtn" data-move="bend">Bend</button>
          <button class="moveBtn" data-move="hammer-on">Hammer-on</button>
          <button class="moveBtn" data-move="pull-off">Pull-off</button>
          <button class="moveBtn" data-move="slide">Slide</button>
        </div>
      </div>

      <div class="sidebarSeparator adminOnly"></div>

      <div id="status" hidden></div>

      <div class="sidebarSection adminOnly">
        <div class="sectionLabel">Edit</div>
        <div class="actionrow">
          <button id="undoBtn" class="action">Undo</button>
          <button id="clearBtn" class="action">Clear</button>
        </div>
      </div>

      <div class="sequenceWrap adminOnly">
        <div class="sequenceTitle">Sequence</div>
        <div id="eventPanel" class="eventpanel"></div>
      </div>

      <div class="playbar playerOnly">
        <button id="playBtn" class="action">Play</button>
        <button id="stopBtn" class="action">Stop</button>
      </div>
      <div class="progress playerOnly"><div id="progressFill" class="progressFill"></div></div>
    </div>

    <div class="maincol">
      <div class="wrap">
        <div id="shell" class="shell">
          <div id="openrow" class="openrow"></div>
          <div class="nut"></div>
          <div id="board" class="board"></div>
          <svg id="moveSvg" class="movementSvg"></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const TOTAL_FRETS=15;
  const TUNING=[40,45,50,55,59,64];
  const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const KEYS=[
    ['C/Am',0],['Db/Bbm',1],['D/Bm',2],['Eb/Cm',3],['E/C#m',4],['F/Dm',5],
    ['Gb/Ebm',6],['G/Em',7],['Ab/Fm',8],['A/F#m',9],['Bb/Gm',10],['B/G#m',11]
  ];
  const MAJOR=new Set([0,2,4,5,7,9,11]);

  const bd=document.getElementById('board');
  const orow=document.getElementById('openrow');
  const shell=document.getElementById('shell');
  const moveSvg=document.getElementById('moveSvg');
  const keySel=document.getElementById('keySel');
  const statusEl=document.getElementById('status');
  const eventPanel=document.getElementById('eventPanel');
  const progressFill=document.getElementById('progressFill');

  const S={
    tool:'framework',
    pendingMove:null,
    keyPc:0,
    events:[],
    author:null,
    playback:null,
    runId:0,
    timer:null,
    nextBendId:1,
    previewEventIndex:null,
    audioUnlocked:false
  };

  function blankState(){
    return {
      framework:new Map(),
      fingers:new Map(), // key -> {s,f,kind:'solid'|'bendRing',bendId?,bendFrom?}
      currentOrigin:null
    };
  }
  S.author=blankState();
  S.playback=blankState();

  // Sampled guitar: same loading/playback strategy as Circle v1.114.
  // Try the local Circle repository sample first, then its public Shinyguitar fallback.
  const GUITAR_SAMPLE_DEFS=[
    {
      midi:60,
      local:"samples/guitar/guitar_C4.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/c4_vl3_rr1_1.wav"
    },
    {
      midi:63,
      local:"samples/guitar/guitar_Eb4.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/eb4_vl3_rr1_1.wav"
    },
    {
      midi:66,
      local:"samples/guitar/guitar_Gb4.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/gb4_vl3_rr1_1.wav"
    },
    {
      midi:69,
      local:"samples/guitar/guitar_A4.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/a4_vl3_rr1_1.wav"
    },
    {
      midi:72,
      local:"samples/guitar/guitar_C5.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/c5_vl3_rr1_1.wav"
    },
    {
      midi:75,
      local:"samples/guitar/guitar_Eb5.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/eb5_vl3_rr1_1.wav"
    },
    {
      midi:78,
      local:"samples/guitar/guitar_Gb5.wav",
      remote:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/gb5_vl3_rr1_1.wav"
    }
  ];

  let guitarAudioCtx=null;
  let guitarMasterGain=null;
  let guitarSampleBuffers=new Map();
  let guitarSamplesPromise=null;
  let activeGuitarSources=[];

  function getAudioCtx(){
    if(!guitarAudioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      guitarAudioCtx=new AC();
      guitarMasterGain=guitarAudioCtx.createGain();
      guitarMasterGain.gain.value=.90;
      guitarMasterGain.connect(guitarAudioCtx.destination);
    }
    return guitarAudioCtx;
  }

  function ensureAudioReady(callback){
    const ctx=getAudioCtx();
    if(!ctx) return;

    try{
      if(ctx.state==="suspended"){
        const resumed=ctx.resume();
        if(resumed && typeof resumed.then==="function"){
          resumed.then(()=>{
            S.audioUnlocked=(ctx.state==="running");
            if(callback) callback(ctx);
          }).catch(()=>{});
          return;
        }
      }
    }catch(_){}

    S.audioUnlocked=(ctx.state==="running");
    if(callback) callback(ctx);
  }

  function fetchAndDecodeGuitarSample(ctx,urls){
    const list=Array.isArray(urls)?urls.slice():[urls];

    function tryNext(index){
      if(index>=list.length) return Promise.reject(new Error("No guitar sample source available"));
      const url=list[index];
      if(!url) return tryNext(index+1);

      return fetch(url,{cache:"force-cache"})
        .then(r=>{
          if(!r.ok) throw new Error(url+" HTTP "+r.status);
          return r.arrayBuffer();
        })
        .then(ab=>ctx.decodeAudioData(ab.slice(0)))
        .catch(()=>tryNext(index+1));
    }

    return tryNext(0);
  }

  function loadGuitarSamples(ctx){
    if(guitarSampleBuffers.size===GUITAR_SAMPLE_DEFS.length) return Promise.resolve(true);
    if(guitarSamplesPromise) return guitarSamplesPromise;

    guitarSamplesPromise=Promise.all(GUITAR_SAMPLE_DEFS.map(def=>{
      return fetchAndDecodeGuitarSample(ctx,[def.local,def.remote])
        .then(buf=>{
          guitarSampleBuffers.set(def.midi,buf);
          return true;
        })
        .catch(err=>{
          console.warn("Guitar sample unavailable at MIDI "+def.midi,err);
          guitarSampleBuffers.delete(def.midi);
          return false;
        });
    })).then(results=>{
      return results.some(Boolean);
    }).finally(()=>{
      guitarSamplesPromise=null;
    });

    return guitarSamplesPromise;
  }

  function nearestGuitarSample(midi){
    let best=null;
    for(const def of GUITAR_SAMPLE_DEFS){
      if(!guitarSampleBuffers.has(def.midi)) continue;
      const distance=Math.abs(midi-def.midi);
      if(!best || distance<best.distance) best={def,distance};
    }
    return best;
  }

  function playSampledMidi(midi,volume=.20,duration=.72){
    const ctx=getAudioCtx();
    if(!ctx || ctx.state!=="running") return false;

    const pick=nearestGuitarSample(midi);
    if(!pick) return false;

    const now=ctx.currentTime+.005;
    const src=ctx.createBufferSource();
    const gain=ctx.createGain();

    src.buffer=guitarSampleBuffers.get(pick.def.midi);
    src.playbackRate.value=Math.pow(2,(midi-pick.def.midi)/12);

    const noteDuration=Math.max(.09,duration||.72);
    const fadeTime=Math.min(.05,noteDuration*.25);
    const fadeStart=now+Math.max(.04,noteDuration-fadeTime);
    const stopAt=now+noteDuration+.012;

    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(volume,now);
    gain.gain.setValueAtTime(volume,fadeStart);
    gain.gain.linearRampToValueAtTime(.0001,now+noteDuration);

    src.connect(gain);
    gain.connect(guitarMasterGain||ctx.destination);
    src.start(now);
    try{src.stop(stopAt)}catch(_){}

    const item={src,gain};
    activeGuitarSources.push(item);
    src.onended=()=>{
      const i=activeGuitarSources.indexOf(item);
      if(i!==-1) activeGuitarSources.splice(i,1);
    };
    return true;
  }

  function playStringSample(s,f,volume=.20,duration=.72){
    return playSampledMidi(midiAt(s,f),volume,duration);
  }

  async function unlockSampleAudio(){
    const ctx=getAudioCtx();
    if(!ctx) return false;

    try{
      if(ctx.state==="suspended") await ctx.resume();
      const loaded=await loadGuitarSamples(ctx);
      if(ctx.state==="suspended"){
        try{await ctx.resume()}catch(_){}
      }
      S.audioUnlocked=!!loaded && ctx.state==="running";
      return S.audioUnlocked;
    }catch(err){
      console.warn("Sampled guitar unavailable:",err);
      S.audioUnlocked=false;
      return false;
    }
  }

  async function auditionDynamicNote(s,f,volume=.20){
    const ctx=getAudioCtx();
    if(!ctx) return;
    const ok=await unlockSampleAudio();
    if(ok) playStringSample(s,f,volume,.72);
  }

  // Circle primes sample loading on the very first user gesture.
  function primeAudioSamples(){
    ensureAudioReady(ctx=>{
      loadGuitarSamples(ctx).catch(()=>{});
    });
  }

  document.addEventListener("touchstart",function bootAudio(){
    primeAudioSamples();
    document.removeEventListener("touchstart",bootAudio);
  },{once:true,passive:true});

  document.addEventListener("mousedown",function bootAudioMouse(){
    primeAudioSamples();
    document.removeEventListener("mousedown",bootAudioMouse);
  },{once:true});

  function clonePos(p){return p?{s:p.s,f:p.f}:null}
  function posKey(s,f){return `${s}:${f}`}
  function fretY(f){return f/TOTAL_FRETS*bd.clientHeight}
  function stringXs(){const w=bd.clientWidth,m=14,u=w-m*2;return Array.from({length:6},(_,i)=>m+u*i/5)}
  function yForFret(f){return f===0?0:(fretY(f-1)+fretY(f))/2}
  function midiAt(s,f){return TUNING[s]+f}
  function pcAt(s,f){return midiAt(s,f)%12}
  function noteName(s,f){return NAMES[pcAt(s,f)]}
  function isInKey(s,f){return MAJOR.has((pcAt(s,f)-S.keyPc+12)%12)}

  function shellPoint(s,f){
    const x=stringXs()[s];
    return f===0?{x,y:32}:{x,y:56+yForFret(f)};
  }

  function bindTap(el,fn){
    let pointer=false;
    el.addEventListener('pointerup',e=>{
      pointer=true;e.preventDefault();e.stopPropagation();fn();
      setTimeout(()=>pointer=false,250);
    },{passive:false});
    el.addEventListener('click',e=>{
      if(pointer)return;
      e.preventDefault();e.stopPropagation();fn();
    });
  }

  function drawBoard(){
    bd.innerHTML='';
    orow.innerHTML='';
    const X=stringXs();

    X.forEach((x,i)=>{
      const st=document.createElement('div');
      st.className='string';
      st.style.left=x+'px';
      st.style.width=(1.15+(5-i)*.33)+'px';
      bd.appendChild(st);

      const o=document.createElement('div');
      o.className='open';
      o.style.left=x+'px';
      o.textContent=NAMES[TUNING[i]%12];
      orow.appendChild(o);

      const h=document.createElement('div');
      h.className='openhit';
      h.style.left=x+'px';
      bindTap(h,()=>handlePosition(i,0));
      orow.appendChild(h);
    });

    for(let f=1;f<=TOTAL_FRETS;f++){
      const fr=document.createElement('div');
      fr.className='fret';
      fr.style.top=fretY(f)+'px';
      bd.appendChild(fr);

      const lab=document.createElement('div');
      lab.className='fretlab';
      lab.style.top=yForFret(f)+'px';
      lab.textContent=f;
      bd.appendChild(lab);
    }

    [3,5,7,9,12,15].forEach(f=>{
      const y=yForFret(f);
      if(f===12){
        [-16,16].forEach(dx=>{
          const d=document.createElement('div');
          d.className='inlay';
          d.style.left=`calc(50% + ${dx}px)`;
          d.style.top=y+'px';
          bd.appendChild(d);
        });
      }else{
        const d=document.createElement('div');
        d.className='inlay';
        d.style.top=y+'px';
        bd.appendChild(d);
      }
    });

    for(let s=0;s<6;s++){
      for(let f=1;f<=TOTAL_FRETS;f++){
        const h=document.createElement('div');
        h.className='hit';
        h.style.left=X[s]+'px';
        h.style.top=yForFret(f)+'px';
        h.style.height=Math.max(30,fretY(f)-fretY(f-1))+'px';
        bindTap(h,()=>handlePosition(s,f));
        bd.appendChild(h);
      }
    }
    renderAuthor();
  }

  function makeMark(cls,s,f,text=''){
    const host=f===0?orow:bd;
    const d=document.createElement('div');
    d.className=cls;
    d.style.left=stringXs()[s]+'px';
    d.style.top=(f===0?32:yForFret(f))+'px';
    d.textContent=text;
    host.appendChild(d);
    return d;
  }

  function clearOverlays(){
    document.querySelectorAll('.frameworkMark,.fingerMark,.moveLabel').forEach(x=>x.remove());
    moveSvg.innerHTML='';
  }

  function renderState(st){
    clearOverlays();
    for(const p of st.framework.values()){
      makeMark(`frameworkMark ${isInKey(p.s,p.f)?'in':'out'}`,p.s,p.f,noteName(p.s,p.f));
    }
    for(const p of st.fingers.values()){
      if(p.kind==='bendRing'){
        makeMark('fingerMark bendRing',p.s,p.f,'');
      }else{
        makeMark('fingerMark',p.s,p.f,noteName(p.s,p.f));
      }
    }
  }

  function renderAuthor(){renderState(S.author)}
  function renderPlayback(){renderState(S.playback)}

  function applyEventInstant(st,e){
    const k=(e.s!==undefined && e.f!==undefined)?posKey(e.s,e.f):null;

    if(e.type==='frameworkOn') st.framework.set(k,{s:e.s,f:e.f});
    if(e.type==='frameworkOff') st.framework.delete(k);

    if(e.type==='fingerOn'){
      st.fingers.set(k,{s:e.s,f:e.f,kind:'solid'});
      st.currentOrigin={s:e.s,f:e.f};
    }

    if(e.type==='fingerOff'){
      st.fingers.delete(k);
      // Any Admin OFF action breaks the implied continuation.
      st.currentOrigin=null;
    }

    if(e.type==='move'){
      const ok=posKey(e.from.s,e.from.f);
      const dk=posKey(e.to.s,e.to.f);

      st.fingers.delete(ok);

      if(e.movement==='bend' && e.bendPhase==='up'){
        // Bent pitch is not a literal finger placement, so represent it as a ring.
        st.fingers.set(dk,{
          s:e.to.s,f:e.to.f,
          kind:'bendRing',
          bendId:e.bendId,
          bendFrom:clonePos(e.from)
        });
      }else{
        // Bend release and all other movements land on a normal solid pink finger.
        st.fingers.set(dk,{s:e.to.s,f:e.to.f,kind:'solid'});
      }

      st.currentOrigin={s:e.to.s,f:e.to.f};
    }
  }

  function rebuildAuthor(){
    S.author=blankState();
    for(const e of S.events) applyEventInstant(S.author,e);
    renderAuthor();
    renderEventList();
  }

  function playableEvents(){return S.events.filter(e=>e.play!==false)}
  function isTimedEvent(e){
    if(e.play===false) return false;
    return e.type!=='frameworkOn' && e.type!=='frameworkOff';
  }

  function currentFingerEntry(){
    if(!S.author.currentOrigin) return null;
    return S.author.fingers.get(posKey(S.author.currentOrigin.s,S.author.currentOrigin.f)) || null;
  }

  function validateMove(kind,from,to,fromEntry){
    if(!from) return 'Add a pink origin note before selecting a movement.';
    if(from.s!==to.s) return `${prettyMove(kind)} must stay on the same string.`;
    if(from.f===to.f) return 'Choose a different destination note.';

    if(kind==='hammer-on' && to.f<from.f)
      return 'A hammer-on destination must be higher in pitch.';

    if(kind==='pull-off' && to.f>from.f)
      return 'A pull-off destination must be lower in pitch.';

    if(kind==='bend'){
      if(fromEntry && fromEntry.kind==='bendRing'){
        const home=fromEntry.bendFrom;
        if(!home || to.s!==home.s || to.f!==home.f)
          return 'To release this bend, tap its linked original fret.';
      }else if(to.f<from.f){
        return 'A bend from a solid pink note must go to a higher pitch.';
      }
    }
    return '';
  }

  function handlePosition(s,f){
    if(document.body.classList.contains('player')) return;
    exitSequencePreview();
    const k=posKey(s,f);

    if(S.tool==='framework'){
      S.events.push({
        type:S.author.framework.has(k)?'frameworkOff':'frameworkOn',
        s,f,
        play:true
      });
      rebuildAuthor();
      announce(`Framework ${S.author.framework.has(k)?'on':'off'}: ${noteName(s,f)}`,true);
      return;
    }

    if(S.tool!=='finger') return;

    if(S.pendingMove){
      const from=clonePos(S.author.currentOrigin);
      const fromEntry=currentFingerEntry();
      const to={s,f};
      const err=validateMove(S.pendingMove,from,to,fromEntry);

      if(err){
        announce(err,false);
        return;
      }

      const kind=S.pendingMove;
      const event={
        type:'move',
        movement:kind,
        from,
        to,
        play:true
      };

      if(kind==='bend'){
        if(fromEntry && fromEntry.kind==='bendRing'){
          event.bendId=fromEntry.bendId;
          event.bendPhase='release';
          event.bendHome=clonePos(fromEntry.bendFrom);
        }else{
          event.bendId='bend-'+(S.nextBendId++);
          event.bendPhase='up';
          event.bendHome=clonePos(from);
        }
      }

      S.events.push(event);

      S.pendingMove=null;
      updateMoveButtons();
      rebuildAuthor();
      auditionDynamicNote(to.s,to.f,.20);

      const extra=(kind==='bend')
        ? (event.bendPhase==='up'?' (bend up)':' (release)')
        : '';
      announce(`${prettyMove(kind)}${extra}: ${noteName(from.s,from.f)} → ${noteName(s,f)}`,true);
      return;
    }

    if(S.author.fingers.has(k)){
      // Edit-only: this must affect playback state at this exact sequence point,
      // but it consumes zero playback time.
      S.events.push({type:'fingerOff',s,f,play:false});
      rebuildAuthor();
      announce(`Finger off: ${noteName(s,f)}. Sequence connection reset.`,false);
      return;
    }

    // No movement armed = ordinary pluck.
    S.events.push({
      type:'fingerOn',
      s,f,
      articulation:'pluck',
      play:true
    });
    rebuildAuthor();
    auditionDynamicNote(s,f,.20);
    announce(`Pluck: ${noteName(s,f)}`,true);
  }

  function prettyMove(kind){
    if(kind==='hammer-on') return 'Hammer-on';
    if(kind==='pull-off') return 'Pull-off';
    if(kind==='bend') return 'Bend';
    if(kind==='slide') return 'Slide';
    return kind;
  }

  function describe(e){
    if(e.type==='frameworkOn') return `Frame + ${noteName(e.s,e.f)}`;
    if(e.type==='frameworkOff') return `Frame − ${noteName(e.s,e.f)}`;
    if(e.type==='fingerOn') return `Pluck ${noteName(e.s,e.f)}`;
    if(e.type==='move'){
      const suffix=(e.movement==='bend' && e.bendPhase==='release')?' release':'';
      return `${prettyMove(e.movement)}${suffix} ${noteName(e.from.s,e.from.f)}→${noteName(e.to.s,e.to.f)}`;
    }
    return e.type;
  }

  function clearSequenceSelection(){
    S.previewEventIndex=null;
    eventPanel.querySelectorAll('.event').forEach(el=>el.classList.remove('selected'));
  }

  function exitSequencePreview(){
    if(S.previewEventIndex===null) return;
    clearSequenceSelection();
    renderAuthor();
  }

  function previewSequenceState(originalEventIndex,row){
    const st=blankState();
    for(let i=0;i<=originalEventIndex;i++){
      applyEventInstant(st,S.events[i]);
    }
    S.previewEventIndex=originalEventIndex;
    renderState(st);
    eventPanel.querySelectorAll('.event').forEach(el=>el.classList.remove('selected'));
    if(row) row.classList.add('selected');
  }

  function renderEventList(){
    const visible=[];
    S.events.forEach((e,originalIndex)=>{
      if(e.play!==false) visible.push({e,originalIndex});
    });

    if(!visible.length){
      eventPanel.innerHTML='<div class="event noEvents"><span class="n">—</span>No playback events yet</div>';
      return;
    }

    eventPanel.innerHTML=visible.map(({e,originalIndex},i)=>
      `<div class="event" data-original-index="${originalIndex}"><span class="n">${i+1}</span>${describe(e)}</div>`
    ).join('');

    eventPanel.querySelectorAll('.event[data-original-index]').forEach(row=>{
      bindTap(row,()=>{
        const idx=Number(row.dataset.originalIndex);
        previewSequenceState(idx,row);
      });
    });

    eventPanel.scrollTop=eventPanel.scrollHeight;
  }

  function toolHelp(){
    if(S.tool==='framework')
      return '<strong>Framework</strong><br>Tap to turn a framework note on/off.';

    if(S.pendingMove==='bend'){
      const entry=currentFingerEntry();
      if(entry && entry.kind==='bendRing')
        return '<strong>Bend armed</strong><br>Tap the linked original fret to release the bend.';
    }

    if(S.pendingMove)
      return `<strong>${prettyMove(S.pendingMove)} armed</strong><br>Tap the destination note. The origin will be replaced by the destination.`;

    const entry=currentFingerEntry();
    if(entry && entry.kind==='bendRing')
      return '<strong>Pink ring</strong><br>This is a bent pitch. Choose Bend, then tap its original fret to release it.';

    return '<strong>Pink finger</strong><br>Tap an empty position for a pluck. Tap an existing pink position to edit it off. Or choose a movement, then tap the destination.';
  }

  function announce(msg,playback){
    statusEl.innerHTML=`<strong>${msg}</strong><br>${playback?'Added as a 1-second playback event.':'Admin edit only — no playback time added.'}`;
    setTimeout(()=>{
      if(!document.body.classList.contains('player')) statusEl.innerHTML=toolHelp();
    },1200);
  }

  function setTool(tool){
    exitSequencePreview();
    S.tool=tool;
    document.querySelectorAll('.noteTool').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));
    statusEl.innerHTML=toolHelp();
  }

  function armMove(kind){
    exitSequencePreview();
    if(S.tool!=='finger') setTool('finger');

    if(S.pendingMove===kind){
      S.pendingMove=null;
    }else{
      if(!S.author.currentOrigin){
        announce('Add a pink origin note first.',false);
        return;
      }
      S.pendingMove=kind;
    }
    updateMoveButtons();
    statusEl.innerHTML=toolHelp();
  }

  function updateMoveButtons(){
    document.querySelectorAll('.moveBtn').forEach(b=>{
      b.classList.toggle('on',b.dataset.move===S.pendingMove);
    });
  }

  function undo(){
    exitSequencePreview();
    if(!S.events.length) return;
    S.events.pop();
    S.pendingMove=null;
    updateMoveButtons();
    rebuildAuthor();
    statusEl.innerHTML=toolHelp();
  }

  function clearAll(){
    exitSequencePreview();
    S.events=[];
    S.pendingMove=null;
    S.nextBendId=1;
    updateMoveButtons();
    rebuildAuthor();
    statusEl.innerHTML=toolHelp();
  }

  function setupSvg(){moveSvg.setAttribute('viewBox','0 0 183 642')}

  function makeAnimatedPinkLine(from,to){
    setupSvg();
    const a=shellPoint(from.s,from.f);
    const z=shellPoint(to.s,to.f);
    const ns='http://www.w3.org/2000/svg';

    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',a.x);
    line.setAttribute('y1',a.y);
    line.setAttribute('x2',z.x);
    line.setAttribute('y2',z.y);
    line.setAttribute('stroke','#ff1493');
    line.setAttribute('stroke-width','4');
    line.setAttribute('stroke-linecap','round');
    line.setAttribute('pathLength','1');
    line.setAttribute('stroke-dasharray','1');
    line.setAttribute('stroke-dashoffset','1');
    moveSvg.appendChild(line);

    return {line,a,z};
  }

  function showMoveLabel(kind,a,z){
    const lab=document.createElement('div');
    lab.className='moveLabel';
    lab.textContent=prettyMove(kind);
    lab.style.left=((a.x+z.x)/2)+'px';
    lab.style.top=((a.y+z.y)/2 - 13)+'px';
    shell.appendChild(lab);
    return lab;
  }

  function sleep(ms){return new Promise(r=>S.timer=setTimeout(r,ms))}

  async function animateMove(e){
    // Start with the current originating state visible.
    renderPlayback();

    const {line,a,z}=makeAnimatedPinkLine(e.from,e.to);
    showMoveLabel(e.movement,a,z);

    requestAnimationFrame(()=>{
      line.style.transition='stroke-dashoffset 850ms linear';
      line.setAttribute('stroke-dashoffset','0');
    });

    await sleep(850);

    // Destination state: bend-up creates a ring; bend release creates solid pink.
    applyEventInstant(S.playback,e);
    renderPlayback();
    playStringSample(e.to.s,e.to.f,.20,.72);

    await sleep(150);
  }

  async function playOne(e){
    if(e.type==='move'){
      await animateMove(e);
      return;
    }

    applyEventInstant(S.playback,e);
    renderPlayback();

    if(e.type==='fingerOn'){
      playStringSample(e.s,e.f,.20,.72);
    }

    await sleep(1000);
  }

  async function playAll(){
    stopPlayback(false);
    const run=++S.runId;
    S.playback=blankState();
    renderPlayback();
    progressFill.style.width='0%';

    // Play is a user gesture, so use it to unlock/load the sampled guitar
    // before the first dynamic note is due.
    await unlockSampleAudio();
    if(run!==S.runId) return;

    const timedTotal=S.events.filter(isTimedEvent).length;
    let timedIndex=0;

    /*
      Framework events and edit-only OFF events are zero-time state changes.
      They are applied immediately at their authored sequence position.
      Only Dynamic notes and Movement events consume one second.
    */
    for(const e of S.events){
      if(run!==S.runId) return;

      if(!isTimedEvent(e)){
        applyEventInstant(S.playback,e);
        renderPlayback();
        continue;
      }

      timedIndex++;
      statusEl.innerHTML=`<strong>${timedIndex}/${timedTotal}</strong><br>${describe(e)}`;
      progressFill.style.width=`${timedTotal?((timedIndex-1)/timedTotal)*100:0}%`;
      await playOne(e);
    }

    if(run===S.runId){
      progressFill.style.width='100%';
      statusEl.innerHTML='<strong>Finished</strong><br>Playback complete.';
    }
  }

  function stopPlayback(reset=true){
    S.runId++;
    if(S.timer){clearTimeout(S.timer);S.timer=null}
    moveSvg.innerHTML='';
    document.querySelectorAll('.moveLabel').forEach(x=>x.remove());
    if(reset) progressFill.style.width='0%';

    if(document.body.classList.contains('player')){
      S.playback=blankState();
      renderPlayback();
      statusEl.innerHTML='<strong>Player</strong><br>Press Play. Each playback event lasts one second.';
    }else{
      renderAuthor();
    }
  }

  function enterAdmin(){
    clearSequenceSelection();
    stopPlayback();
    document.body.classList.remove('player');
    document.getElementById('adminTab').classList.add('on');
    document.getElementById('playerTab').classList.remove('on');
    renderAuthor();
    statusEl.innerHTML=toolHelp();
  }

  function enterPlayer(){
    stopPlayback();
    document.body.classList.add('player');
    document.getElementById('playerTab').classList.add('on');
    document.getElementById('adminTab').classList.remove('on');
    S.playback=blankState();
    renderPlayback();
    statusEl.innerHTML='<strong>Player</strong><br>Press Play. Each playback event lasts one second.';
  }

  KEYS.forEach(([name,pc])=>keySel.add(new Option(name,pc)));
  keySel.value='0';
  keySel.addEventListener('change',()=>{
    exitSequencePreview();
    S.keyPc=Number(keySel.value);
    if(document.body.classList.contains('player')) renderPlayback();
    else renderAuthor();
  });

  document.querySelectorAll('.noteTool').forEach(b=>bindTap(b,()=>setTool(b.dataset.tool)));
  document.querySelectorAll('.moveBtn').forEach(b=>bindTap(b,()=>armMove(b.dataset.move)));

  bindTap(document.getElementById('undoBtn'),undo);
  bindTap(document.getElementById('clearBtn'),clearAll);
  bindTap(document.getElementById('adminTab'),enterAdmin);
  bindTap(document.getElementById('playerTab'),enterPlayer);
  bindTap(document.getElementById('playBtn'),playAll);
  bindTap(document.getElementById('stopBtn'),()=>stopPlayback());

  drawBoard();
  renderEventList();
  statusEl.innerHTML=toolHelp();
})();
</script>
</body>
</html>
